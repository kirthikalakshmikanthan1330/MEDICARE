<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEEDBACK</title>
    <link rel="icon" href="Saved Pictures/icon.jpg">
    <style>
        body{
            font-size: xx-large;
            font-family: cursive;
        }
    </style>
    <style>
        body{
            cursor: pointer;
        }
    </style>
</head>
<body style="background-image:url(Saved\ Pictures/feed.avif);background-repeat: no-repeat;background-position: center;background-size:100%;background-attachment: fixed;"></body>
    <center>
        <h1>FEEDBACK</h1>
        <P>If you prefer, you can also fill out our feedback form, and we will get back to you as soon as possible.</P>
        <form onsubmit="return showAlert()">
            <table>
                <tr>
                    <td><label for="name">Name:</label></td>
                    <td><input type="text" id="name" name="name" required></td>
                </tr>
                <tr>
                    <td><label for="email">Email:</label></td>
                    <td><input type="email" id="email" name="email" required></td>
                </tr>
                <tr>
                    <td><label for="phone">Phone Number:</label></td>
                    <td><input type="tel" id="phone" name="phone"></td>
                </tr>
                <tr>
                    <td><label for="rating">Rating (1-5):</label></td>
                    <td>
                        <select id="rating" name="rating">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="message">Message:</label></td>
                    <td><textarea id="message" name="message" rows="4" required></textarea></td>
                </tr>
                <tr>
                    <td><label for="suggestions">Suggestions:</label></td>
                    <td><textarea id="suggestions" name="suggestions" rows="4"></textarea></td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align:center;">
                        <button type="submit">Submit</button>
                    </td>
                </tr>
            </table>
        </form>
        </center>
        <script>
        function showAlert() {
            alert("Your feedback is submitted. Thank you!");
            return true;  
        }
        </script>
        
</body>
</html>
