<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCTOR DIRECTORY</title>
    <link rel="icon" href="Saved Pictures/icon.jpg">
    <style>
        body {
            cursor: pointer;
            background-image: url('Saved Pictures/d1.jpg');
            background-position: center;
            background-size: cover;
        }
        h1 {
            font-family: cursive;
        }
        button {
            font-size: larger;
            padding: 10px 20px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: darkgreen;
        }
    </style>
</head>
<body>
    <h1><b>DOCTOR DIRECTORY</b></h1>
    <form id="doctorForm">
        <h2>PERSONAL DETAILS</h2>
        <table>
            <tr>
                <td style="font-size:larger;">Name</td>
                <td><input type="text" id="name" placeholder="Enter your name" required></td>
            </tr>
            <tr>
                <td style="font-size:larger;">Gender</td>
                <td>
                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td style="font-size:larger;">Age</td>
                <td><input type="number" id="age" placeholder="Enter your age" required></td>
            </tr>
        </table>
        
        <h2><b>PROFESSIONAL DETAILS</b></h2>
        <table>
            <tr>
                <td style="font-size:larger;">Qualification</td>
                <td>
                    <select id="qualification" required>
                        <option value="">Select your qualification</option>
                        <option>MBBS</option>
                        <option>MD</option>
                        <option>MS</option>
                        <option>BDS</option>
                        <option>MDS</option>
                        <option>DM</option>
                        <option>MCh</option>
                        <option>Siddha</option>
                        <option>Ayurvedha</option>
                        <option>NIL</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td style="font-size:larger;">Specialist</td>
                <td>
                    <select id="specialist" required>
                        <option value="">Select your doctor</option>
                        <option>Cardiologist</option>
                        <option>Dermatologist</option>
                        <option>Neurologist</option>
                        <option>Pediatrician</option>
                        <option>Psychiatrist</option>
                        <option>Urologist</option>
                        <option>NIL</option>
                    </select>
                </td>
            </tr>
        </table>
        
        <h2><b>CONTACT DETAILS</b></h2>
        <table>
            <tr>
                <td style="font-size:larger;">Clinic/Hospital Name</td>
                <td><input type="text" id="clinic" placeholder="Enter the name" required></td>
            </tr>
            <tr>
                <td style="font-size:larger;">Address</td>
                <td><input type="text" id="address" placeholder="Enter your address" required></td>
            </tr>
            <tr>
                <td style="font-size:larger;">Contact number</td>
                <td><input type="text" id="contact" placeholder="Enter your contact number" required></td>
            </tr>
            <tr>
                <td style="font-size:larger;">Email</td>
                <td><input type="email" id="email" placeholder="Enter your email" required></td>
            </tr>
        </table>
        
        <h2><b>CONSULTATION DETAILS</b></h2>
        <table>
            <tr>
                <td style="font-size:larger;">Consultation Mode</td>
                <td>
                    <select id="consultationMode" required>
                        <option value="">Select your mode</option>
                        <option>In-Person</option>
                        <option>Online</option>
                        <option>Home Visit</option>
                        <option>All</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td style="font-size:larger;">Consultation Fees</td>
                <td><input type="number" id="fees" placeholder="Enter fees" required></td>
            </tr>
            <tr>
                <td style="font-size:larger;">Availability</td>
                <td><input type="datetime-local" id="availability" required></td>
            </tr>
        </table>
        
        <button type="submit" id="registerButton">Register</button>
    </form>
    
    <script>
        document.getElementById("registerButton").addEventListener("mouseover", function() {
            console.log("Mouse hovered over Register button");
        });

        document.getElementById("registerButton").addEventListener("click", function(event) {
            event.preventDefault();
            
            let age = document.getElementById("age").value;
            let contact = document.getElementById("contact").value;
            
            if (age < 25 || age > 100) {
                alert("Age must be between 25 and 100.");
                return;
            }
            
            if (!/^\d{10}$/.test(contact)) {
                alert("Contact number must be exactly 10 digits.");
                return;
            }
            
            console.log("Register button clicked");
            alert("Registration successful! Your details have been recorded.");
        });
    </script>
</body>
</html>
